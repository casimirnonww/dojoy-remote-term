<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>DOJOY 服务器终端</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121a2b;
      --line: #243147;
      --text: #e8eef7;
      --muted: #93a4bd;
      --accent: #4f8cff;
      --accent-soft: rgba(79,140,255,.14);
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      flex: 0 0 auto;
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px 12px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 128px; }
    .brand strong { font-size: 14px; letter-spacing: .2px; }
    .brand span { font-size: 11px; color: var(--muted); }
    .host-tabs, .session-tabs {
      display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; align-items: center;
    }
    .host-tab, .session-tab, .btn {
      appearance: none; border: 1px solid var(--line);
      background: #0f1728; color: var(--text);
      border-radius: 10px; cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .host-tab { padding: 8px 12px; text-align: left; min-width: 138px; }
    .host-tab:hover, .session-tab:hover, .btn:hover { border-color: #3a4d6d; background: #132038; }
    .host-tab.active, .session-tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(79,140,255,.25);
    }
    .host-tab .name { display: block; font-size: 13px; font-weight: 600; }
    .host-tab .meta { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
    .host-tab .count { display: inline-block; margin-top: 4px; font-size: 10px; color: var(--muted); }
    .session-tab {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 10px; font-size: 12px; min-height: 34px;
    }
    .session-tab .close {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .session-tab .close:hover { color: var(--danger); }
    .btn { padding: 8px 10px; font-size: 12px; border-radius: 8px; white-space: nowrap; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { border-color: rgba(79,140,255,.45); background: rgba(79,140,255,.16); }
    .btn.active { border-color: var(--accent); background: var(--accent-soft); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .label { font-size: 11px; color: var(--muted); min-width: 52px; }
    .workspace { position: relative; flex: 1 1 auto; min-height: 280px; background: var(--bg); }
    .overview { position: absolute; inset: 0; overflow: auto; padding: 18px; }
    .overview-inner { max-width: 1680px; margin: 0 auto; }
    .overview-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 7px; }
    h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
    .subtitle, .status-notice { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
    .status-notice { min-height: 20px; margin-bottom: 9px; overflow-wrap: anywhere; }
    .status-notice.warning { color: #f5bd69; }
    .host-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .host-card { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); min-width: 0; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status-badge.online { color: #75dba8; }
    .status-badge.stale { color: #f5bd69; }
    .status-badge.unreachable, .status-badge.invalid { color: #ff8b8b; }
    .machine-name { min-height: 16px; margin: 6px 0 10px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .config { margin: 0 0 12px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 5px 6px; font-size: 12px; line-height: 1.4; }
    .config dt { color: var(--muted); }
    .config dd { margin: 0; overflow-wrap: anywhere; }
    .metric { margin-top: 10px; }
    .metric-heading { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .metric-heading span:first-child { color: var(--muted); }
    .metric-value { text-align: right; font-variant-numeric: tabular-nums; }
    .meter { height: 5px; border-radius: 4px; background: #233049; margin-top: 6px; overflow: hidden; }
    .meter-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
    .meter-fill.high { background: #e5aa59; }
    .meter-fill.critical { background: #f27b7b; }
    .card-note { min-height: 30px; margin: 10px 0 8px; color: var(--muted); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
    .card-times { color: var(--muted); font-size: 11px; line-height: 1.7; font-variant-numeric: tabular-nums; }
    .card-times time { display: block; }
    .pane {
      position: absolute; inset: 0; background: #000;
      visibility: hidden; pointer-events: none; z-index: 0;
    }
    .pane.active { visibility: visible; pointer-events: auto; z-index: 1; }
    .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .empty {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; text-align: center;
      color: var(--muted); font-size: 13px; line-height: 1.6;
      background: radial-gradient(circle at top, #121a2b 0%, #0b1220 60%);
      padding: 24px;
    }
    .empty.show { display: flex; }
    @media (min-width: 1180px) {
      .host-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .host-card { padding: 13px; }
      .card-heading { gap: 5px; }
      .card-heading h2 { font-size: 14px; }
      .config { min-height: 112px; align-content: start; }
      .metric-heading { gap: 5px; font-size: 11px; }
      .card-foot { flex-direction: column; align-items: stretch; gap: 7px; }
      .card-foot .btn { padding: 7px 9px; }
    }
    @media (min-width: 1400px) {
      .host-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .topbar { padding: 9px; }
      .brand { flex: 1; }
      .host-tabs { flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
      .host-tab { min-width: 110px; flex-shrink: 0; padding: 7px 9px; }
      .overview { padding: 17px 12px; }
      .host-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .overview-heading { align-items: flex-start; }
      .host-card { padding: 17px; }
      .workspace { min-height: 340px; }
    }
    .workspace.terminal-mode { --status-width: 350px; }
    .terminal-mode .overview {
      left: auto; width: var(--status-width); padding: 14px;
      border-left: 1px solid var(--line); background: var(--bg); z-index: 2;
    }
    .terminal-mode .pane, .terminal-mode .empty { right: var(--status-width); }
    .terminal-mode .overview-heading {
      gap: 8px; align-items: flex-start; position: sticky; top: 0; z-index: 3;
      padding: 7px 0; background: var(--bg);
    }
    .terminal-mode h1 { font-size: 16px; }
    .terminal-mode .subtitle, .terminal-mode .status-notice { font-size: 11px; }
    .terminal-mode .host-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .terminal-mode .host-card { padding: 14px; }
    .terminal-mode .config { min-height: 0; }
    .terminal-mode .card-foot { flex-direction: row; align-items: flex-end; }
    .terminal-mode .host-card.current {
      border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(79,140,255,.18);
    }
    .terminal-mode .host-card.current h2::after {
      content: "当前"; color: var(--accent); font-size: 10px; font-weight: 500; margin-left: 7px;
    }
    @media (max-width: 800px) {
      .workspace.terminal-mode { min-height: 480px; --status-height: 220px; }
      .terminal-mode .overview {
        top: auto; left: 0; right: 0; width: auto; height: var(--status-height);
        border-left: 0; border-top: 1px solid var(--line); padding: 12px;
      }
      .terminal-mode .pane, .terminal-mode .empty { right: 0; bottom: var(--status-height); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="row">
      <div class="brand">
        <strong>DOJOY 服务器终端</strong>
        <span><span id="summary">已打开会话：0</span> · <a href="/knowledge/" style="color:#4f8cff">知识库</a></span>
      </div>
      <button class="btn active" id="overviewBtn" type="button" aria-pressed="true">运行概览</button>
      <div class="host-tabs" id="hostTabs" role="tablist" aria-label="服务器"></div>
      <button class="btn" id="reconnectBtn" type="button" title="仅重连当前会话" hidden>重连当前</button>
    </div>
    <div class="row" id="sessionRow" hidden>
      <div class="label">会话</div>
      <div class="session-tabs" id="sessionTabs" role="tablist" aria-label="会话列表"></div>
      <button class="btn primary" id="newSessionBtn" type="button">+ 新开终端</button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="overview" id="overview" aria-labelledby="overviewTitle">
      <div class="overview-inner">
        <div class="overview-heading">
          <div><h1 id="overviewTitle">运行概览</h1><p class="subtitle">每 30 秒采集 · 选择一台机器即可打开终端</p></div>
          <button class="btn" id="refreshStatusBtn" type="button" title="读取服务端最新缓存，不触发额外采集">读取最新</button>
        </div>
        <p class="status-notice" id="statusNotice" role="status">正在读取服务器运行情况…</p>
        <div class="host-grid" id="hostGrid"></div>
      </div>
    </section>
    <div class="empty" id="emptyHint">
      选择顶部服务器，点「+ 新开终端」可多开会话。
    </div>
  </main>
  <script>
    const HOSTS = [
      { id: "vps", name: "VPS", meta: "主站", path: "/vps/" },
      { id: "fa", name: "财务机", meta: "fa", path: "/aliyun-new/" },
      { id: "tencent-new", name: "腾讯新机", meta: "gg", path: "/tencent-new/" },
      { id: "tencent-main", name: "腾讯大总管", meta: "Chris", path: "/tencent-main/" },
      { id: "mbp-dojoy", name: "另一台 Mac", meta: "局域网", path: "/mbp-dojoy/" },
      { id: "mac-local", name: "本机 Mac", meta: "当前电脑", path: "/mac-local/" }
    ];
    const MIN_SESSIONS = 1; // 切机默认 1 路，不自动开 3
    const MAX_SESSIONS = 6;

    const hostTabsEl = document.getElementById("hostTabs");
    const sessionTabsEl = document.getElementById("sessionTabs");
    const workspace = document.getElementById("workspace");
    const emptyHint = document.getElementById("emptyHint");
    const summary = document.getElementById("summary");
    const newSessionBtn = document.getElementById("newSessionBtn");
    const reconnectBtn = document.getElementById("reconnectBtn");
    const overviewEl = document.getElementById("overview");
    const overviewBtn = document.getElementById("overviewBtn");
    const sessionRow = document.getElementById("sessionRow");
    const hostGrid = document.getElementById("hostGrid");
    const statusNotice = document.getElementById("statusNotice");
    const refreshStatusBtn = document.getElementById("refreshStatusBtn");

    const hosts = {};
    let activeHostId = null;
    let activeSessionKey = null;
    let seq = 1;
    let tearingDownAll = false;
    let overviewVisible = true;
    let snapshot = null;
    let statusError = "";
    let activeRequest = null;
    let requestGeneration = 0;
    let pollTimer = null;
    let freshnessTimer = null;
    let resumeRefresh = false;
    const STATUS_INTERVAL_MS = 30000;
    const FRESHNESS_MS = 90000;
    const statusCards = new Map();

    function el(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    }

    function createStatusCard(host) {
      const card = el("article", "host-card");
      const heading = el("div", "card-heading");
      const title = el("h2", "", host.name);
      const badge = el("span", "status-badge", "尚无数据");
      heading.append(title, badge);
      const hostname = el("p", "machine-name", "—");
      const config = el("dl", "config");
      const configValues = {};
      [["cpu", "CPU"], ["cores", "核心"], ["system", "系统"], ["arch", "架构"]].forEach(([key, label]) => {
        const value = el("dd", "", "—");
        config.append(el("dt", "", label), value);
        configValues[key] = value;
      });
      card.append(heading, hostname, config);
      const gauges = {};
      [["cpu", "CPU 使用率"], ["memory", "内存"], ["disk", "根盘"]].forEach(([key, label]) => {
        const metric = el("div", "metric");
        const row = el("div", "metric-heading");
        const value = el("span", "metric-value", "—");
        row.append(el("span", "", label), value);
        const meter = el("div", "meter");
        meter.setAttribute("aria-hidden", "true");
        const fill = el("div", "meter-fill");
        meter.append(fill);
        metric.append(row, meter);
        card.append(metric);
        gauges[key] = { value, fill };
      });
      const networkRow = el("div", "metric metric-heading");
      const network = el("span", "metric-value", "↓ — / ↑ —");
      networkRow.append(el("span", "", "下载 / 上传"), network);
      const note = el("p", "card-note", "尚未收到采集数据，终端仍可打开。");
      const foot = el("div", "card-foot");
      const times = el("div", "card-times");
      const uptime = el("div", "", "运行时长：—");
      const successAt = el("time", "", "最近成功：—");
      times.append(uptime, successAt);
      const open = el("button", "btn primary", "打开终端");
      open.type = "button";
      open.setAttribute("aria-label", "打开" + host.name + "终端");
      open.addEventListener("click", () => activateHost(host.id));
      foot.append(times, open);
      card.append(networkRow, note, foot);
      hostGrid.append(card);
      statusCards.set(host.id, { card, badge, hostname, configValues, gauges, network, note, uptime, successAt });
    }

    function safeText(value) { return typeof value === "string" && value.trim() ? value.trim().slice(0, 200) : "—"; }
    function finiteNumber(value) { return typeof value === "number" && Number.isFinite(value); }
    function validBytes(value) { return finiteNumber(value) && value >= 0 && value <= Number.MAX_SAFE_INTEGER; }
    function plainObject(value) { return Boolean(value) && typeof value === "object" && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype; }
    function positiveInteger(value) { return Number.isSafeInteger(value) && value > 0; }
    function validPercent(value) { return finiteNumber(value) && value >= 0 && value <= 100; }
    function validMetrics(metrics) {
      if (!plainObject(metrics)) return false;
      if (!["hostname", "os", "arch", "cpu_model"].every(key => typeof metrics[key] === "string" && metrics[key].trim())) return false;
      if (!positiveInteger(metrics.cpu_cores) || metrics.cpu_cores > 65536) return false;
      if (!["memory", "disk"].every(key => positiveInteger(metrics[key + "_total_bytes"]) && validBytes(metrics[key + "_used_bytes"]) && metrics[key + "_used_bytes"] <= metrics[key + "_total_bytes"])) return false;
      if (!validBytes(metrics.uptime_seconds)) return false;
      if (metrics.cpu_percent !== null && !validPercent(metrics.cpu_percent)) return false;
      if (metrics.load_1 !== null && !validBytes(metrics.load_1)) return false;
      if (!["network_rx_bytes_per_second", "network_tx_bytes_per_second"].every(key => metrics[key] === undefined || metrics[key] === null || validBytes(metrics[key]))) return false;
      return metrics.network_interface === undefined || metrics.network_interface === null || typeof metrics.network_interface === "string";
    }
    function timestamp(value) { return typeof value === "string" ? Date.parse(value) : NaN; }
    function timeLabel(value) {
      const ms = timestamp(value);
      return Number.isFinite(ms) ? new Date(ms).toLocaleString("zh-CN", { hour12: false }) : "—";
    }
    function isFresh(ms, now) { return Number.isFinite(ms) && ms <= now + 10000 && now - ms < FRESHNESS_MS; }
    function bytesLabel(value) {
      if (!validBytes(value)) return "—";
      if (value < 1024) return Math.round(value) + " B";
      const units = ["KiB", "MiB", "GiB", "TiB", "PiB"];
      const index = Math.min(units.length - 1, Math.floor(Math.log(value) / Math.log(1024)) - 1);
      return (value / Math.pow(1024, index + 1)).toFixed(1) + " " + units[index];
    }
    function durationLabel(seconds) {
      if (!finiteNumber(seconds) || seconds < 0 || seconds > Number.MAX_SAFE_INTEGER) return "—";
      const mins = Math.floor(seconds / 60);
      const days = Math.floor(mins / 1440);
      const hours = Math.floor(mins / 60) % 24;
      return (days ? days + "天 " : "") + (hours || days ? hours + "小时 " : "") + mins % 60 + "分钟";
    }
    function capacity(used, total) {
      if (!positiveInteger(total) || !validBytes(used) || used > total) return { text: "—", percent: null };
      return { text: bytesLabel(used) + " / " + bytesLabel(total), percent: used / total * 100 };
    }
    function updateGauge(gauge, text, percent) {
      gauge.value.textContent = text;
      gauge.fill.style.width = (percent === null ? 0 : percent) + "%";
      gauge.fill.classList.toggle("high", percent !== null && percent >= 75 && percent < 90);
      gauge.fill.classList.toggle("critical", percent !== null && percent >= 90);
    }
    function hostStatus(data, now) {
      if (!data) return { label: "尚无数据", kind: "unknown" };
      if (data.status === "unreachable" || data.status === "error") return { label: "不可达", kind: "unreachable" };
      if (data.status !== "online" || !validMetrics(data.metrics) || !Number.isFinite(timestamp(data.last_success_at))) return { label: "数据异常", kind: "invalid" };
      if (data.status === "online" && isFresh(timestamp(data.last_success_at), now) && isFresh(timestamp(snapshot.generated_at), now)) {
        return { label: "在线", kind: "online" };
      }
      return { label: "数据过期", kind: "stale" };
    }

    function renderStatus() {
      const now = Date.now();
      const byId = new Map((snapshot ? snapshot.hosts : []).filter(h => h && typeof h === "object").map(h => [h.id, h]));
      let nextExpiry = Infinity;
      let onlineCount = 0;
      HOSTS.forEach(host => {
        const data = byId.get(host.id);
        const card = statusCards.get(host.id);
        const metrics = data && plainObject(data.metrics) ? data.metrics : {};
        const state = hostStatus(data, now);
        if (state.kind === "online") {
          onlineCount++;
          nextExpiry = Math.min(nextExpiry, timestamp(data.last_success_at) + FRESHNESS_MS, timestamp(snapshot.generated_at) + FRESHNESS_MS);
        }
        card.badge.textContent = state.label;
        card.badge.className = "status-badge " + state.kind;
        card.hostname.textContent = safeText(metrics.hostname);
        card.configValues.cpu.textContent = safeText(metrics.cpu_model);
        card.configValues.cores.textContent = Number.isInteger(metrics.cpu_cores) && metrics.cpu_cores > 0 && metrics.cpu_cores <= 65536 ? metrics.cpu_cores + " 个逻辑核心" : "—";
        card.configValues.system.textContent = safeText(metrics.os);
        card.configValues.arch.textContent = safeText(metrics.arch);
        const cpu = validPercent(metrics.cpu_percent) ? metrics.cpu_percent : null;
        updateGauge(card.gauges.cpu, cpu === null ? "—" : cpu.toFixed(1) + "%", cpu);
        const memory = capacity(metrics.memory_used_bytes, metrics.memory_total_bytes);
        const disk = capacity(metrics.disk_used_bytes, metrics.disk_total_bytes);
        updateGauge(card.gauges.memory, memory.text, memory.percent);
        updateGauge(card.gauges.disk, disk.text, disk.percent);
        const rate = value => validBytes(value) ? bytesLabel(value) + "/s" : "—";
        card.network.textContent = "↓ " + rate(metrics.network_rx_bytes_per_second) + " / ↑ " + rate(metrics.network_tx_bytes_per_second);
        card.network.title = metrics.network_interface ? "网卡：" + safeText(metrics.network_interface) : "";
        card.uptime.textContent = "运行时长：" + durationLabel(metrics.uptime_seconds);
        card.successAt.textContent = "最近成功：" + timeLabel(data && data.last_success_at);
        if (data && Number.isFinite(timestamp(data.last_success_at))) card.successAt.dateTime = data.last_success_at;
        else card.successAt.removeAttribute("datetime");
        const notes = [];
        if ((state.kind === "unreachable" || state.kind === "stale") && data && data.metrics) notes.push("上次数据");
        if (state.kind === "unreachable") notes.push(data.error ? safeText(data.error) : "本轮采集未成功");
        if (state.kind === "stale") notes.push("采集已超过 90 秒或时间异常，等待更新");
        if (state.kind === "unknown") notes.push("尚未收到采集数据，终端仍可打开");
        if (state.kind === "invalid") notes.push("采集数据不完整或数值异常，等待下一次采集");
        if (metrics.memory_note) notes.push(safeText(metrics.memory_note));
        card.note.textContent = notes.join(" · ") || "当前采样值 · 下载 / 上传为采样期间平均速率";
      });
      statusNotice.classList.toggle("warning", Boolean(statusError));
      statusNotice.textContent = statusError || (snapshot
        ? "在线 " + onlineCount + " / " + HOSTS.length + " · 数据更新：" + timeLabel(snapshot.generated_at) + " · 读取最新仅获取缓存"
        : "正在读取服务器运行情况…");
      clearTimeout(freshnessTimer);
      if (!document.hidden && Number.isFinite(nextExpiry)) freshnessTimer = setTimeout(renderStatus, Math.max(1, nextExpiry - now + 1));
    }

    async function refreshStatus() {
      if (document.hidden || activeRequest) return;
      clearTimeout(pollTimer);
      resumeRefresh = false;
      const generation = ++requestGeneration;
      const controller = new AbortController();
      activeRequest = controller;
      refreshStatusBtn.disabled = true;
      refreshStatusBtn.textContent = "读取中…";
      let timedOut = false;
      const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, 8000);
      try {
        const response = await fetch("/status.json", { cache: "no-store", signal: controller.signal });
        if (!response.ok) {
          if (response.status === 401) throw new Error("运行情况需要登录，请重新登录后读取。终端入口仍可使用。");
          if (response.status === 404) throw new Error("监控数据尚未启用（404），请等待采集服务就绪。终端入口仍可使用。");
          throw new Error("读取运行情况失败（HTTP " + response.status + "）。稍后自动重试，已显示的数据暂时保留。");
        }
        const result = await response.json();
        if (!result || result.schema_version !== 1 || !Array.isArray(result.hosts) || !Number.isFinite(timestamp(result.generated_at))) {
          throw new Error("运行情况数据格式不正确，已显示的数据暂时保留。");
        }
        if (generation !== requestGeneration || document.hidden) return;
        if (snapshot && timestamp(result.generated_at) < timestamp(snapshot.generated_at)) {
          throw new Error("服务器返回了较早的缓存，继续显示已读取的数据，稍后自动重试。");
        }
        snapshot = result;
        statusError = "";
        renderStatus();
      } catch (error) {
        if (generation !== requestGeneration || document.hidden) return;
        statusError = timedOut ? "读取运行情况超时，稍后自动重试。已显示的数据暂时保留。"
          : error instanceof SyntaxError ? "运行情况数据无法解析，已显示的数据暂时保留。"
          : error instanceof TypeError ? "暂时无法读取运行情况，请检查网络。已显示的数据暂时保留。"
          : error.message || "暂时无法读取运行情况，稍后自动重试。";
        renderStatus();
      } finally {
        clearTimeout(timeout);
        if (activeRequest === controller) activeRequest = null;
        refreshStatusBtn.disabled = false;
        refreshStatusBtn.textContent = "读取最新";
        if (!document.hidden) {
          if (resumeRefresh) refreshStatus();
          else pollTimer = setTimeout(refreshStatus, STATUS_INTERVAL_MS);
        }
      }
    }

    function showOverview() {
      overviewVisible = true;
      workspace.classList.remove("terminal-mode");
      overviewEl.hidden = false;
      overviewEl.scrollTop = 0;
      overviewBtn.classList.add("active");
      overviewBtn.setAttribute("aria-pressed", "true");
      sessionRow.hidden = true;
      reconnectBtn.hidden = true;
      emptyHint.classList.remove("show");
      HOSTS.forEach(h => {
        hosts[h.id].tab.classList.remove("active");
        hosts[h.id].tab.setAttribute("aria-selected", "false");
        hosts[h.id].sessions.forEach(s => s.pane.classList.remove("active"));
        statusCards.get(h.id).card.classList.remove("current");
        statusCards.get(h.id).card.removeAttribute("aria-current");
      });
      summary.textContent = "已打开会话：" + HOSTS.reduce((total, h) => total + countSessions(h.id), 0);
      renderStatus();
    }

    function showTerminal() {
      overviewVisible = false;
      workspace.classList.add("terminal-mode");
      overviewEl.hidden = false;
      overviewBtn.classList.remove("active");
      overviewBtn.setAttribute("aria-pressed", "false");
      sessionRow.hidden = false;
      reconnectBtn.hidden = false;
    }

    function highlightStatusHost(hostId) {
      statusCards.forEach((state, id) => {
        state.card.classList.toggle("current", id === hostId);
        if (id === hostId) state.card.setAttribute("aria-current", "true");
        else state.card.removeAttribute("aria-current");
      });
      // 只滚动概览容器，保持终端和整页位置不变；不触碰已有 iframe。
      requestAnimationFrame(() => {
        if (overviewVisible || activeHostId !== hostId) return;
        const card = statusCards.get(hostId).card;
        const bounds = overviewEl.getBoundingClientRect();
        const cardBounds = card.getBoundingClientRect();
        const headingHeight = overviewEl.querySelector(".overview-heading").offsetHeight;
        if (cardBounds.top < bounds.top + headingHeight || cardBounds.bottom > bounds.bottom) {
          overviewEl.scrollTop += cardBounds.top - bounds.top - headingHeight - 14;
        }
      });
    }

    function hostById(id) { return HOSTS.find(h => h.id === id); }
    function sessionKey(hostId, sid) { return hostId + "::" + sid; }
    function countSessions(hostId) { return hosts[hostId].sessions.length; }

    function updateHostCount(hostId) {
      const h = hosts[hostId];
      const n = countSessions(hostId);
      h.tab.querySelector(".count").textContent = n + " 个会话";
      reconnectBtn.disabled = !activeSessionKey;
      if (overviewVisible) summary.textContent = "已打开会话：" + HOSTS.reduce((total, host) => total + countSessions(host.id), 0);
      if (activeHostId === hostId) {
        newSessionBtn.disabled = n >= MAX_SESSIONS;
        newSessionBtn.textContent = n >= MAX_SESSIONS ? "会话已满" : "+ 新开终端";
        if (!overviewVisible) summary.textContent = "已打开会话：" + n;
      }
    }

    function renderSessionTabs() {
      sessionTabsEl.replaceChildren();
      if (!activeHostId) return;
      hosts[activeHostId].sessions.forEach(s => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "session-tab" + (s.key === activeSessionKey ? " active" : "");
        btn.append(el("span", "", s.title));
        btn.addEventListener("click", () => activateSession(s.key));
        const close = document.createElement("button");
        close.type = "button";
        close.className = "close";
        close.title = "关闭会话";
        close.textContent = "×";
        close.addEventListener("click", (e) => { e.stopPropagation(); closeSession(s.key); });
        btn.appendChild(close);
        sessionTabsEl.appendChild(btn);
      });
    }

    function createHostTab(host) {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "host-tab";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", "false");
      tab.append(el("span", "name", host.name), el("span", "meta", host.meta), el("span", "count", "0 个会话"));
      tab.addEventListener("click", () => activateHost(host.id));
      hostTabsEl.appendChild(tab);
      hosts[host.id] = { tab: tab, sessions: [], nextNo: 1 };
    }

    // 卸载终端页面；远端进程是否结束由 ttyd、SSH 和进程自身行为决定。
    function killIframe(session) {
      if (!session) return;
      const iframe = session.iframe;
      session.iframe = null;
      session.closed = true;
      if (!iframe) return;
      try { iframe.onload = null; } catch (e) {}
      try { iframe.onerror = null; } catch (e) {}
      // 尝试停止并导航离开旧终端页面。
      try {
        if (iframe.contentWindow) {
          try { iframe.contentWindow.stop(); } catch (e2) {}
          try { iframe.contentWindow.location.replace("about:blank"); } catch (e2) {}
        }
      } catch (e) {}
      try { iframe.src = "about:blank"; } catch (e) {}
      // 从页面移除旧 iframe，释放浏览器端会话。
      try { iframe.remove(); } catch (e) {}
      try { if (session.pane) session.pane.replaceChildren(); } catch (e) {}
    }

    function ensureIframe(session) {
      if (session.closed) return;
      if (session.iframe) return;
      const host = hostById(session.hostId);
      session.pane.replaceChildren();
      const iframe = document.createElement("iframe");
      iframe.title = host.name + " " + session.title;
      iframe.allow = "clipboard-read; clipboard-write";
      // 每次新开必须带新 token，避免复用旧连接
      iframe.src = host.path + "?session=" + encodeURIComponent(session.sid)
        + "&t=" + Date.now() + "&kill_on_close=1";
      session.pane.appendChild(iframe);
      session.iframe = iframe;
    }

    function createSession(hostId, autoActivate) {
      const host = hostById(hostId);
      const state = hosts[hostId];
      if (!host || !state) return null;
      if (countSessions(hostId) >= MAX_SESSIONS) return null;

      const sid = String(seq++);
      const no = state.nextNo++;
      const key = sessionKey(hostId, sid);
      const pane = document.createElement("div");
      pane.className = "pane";
      pane.dataset.key = key;
      workspace.appendChild(pane);

      const session = {
        key: key, hostId: hostId, sid: sid, no: no, title: "#" + no,
        pane: pane, iframe: null, closed: false
      };
      state.sessions.push(session);
      ensureIframe(session);
      updateHostCount(hostId);
      renderSessionTabs();
      if (autoActivate) activateSession(key);
      return session;
    }

    function activateHost(hostId) {
      if (!hosts[hostId]) return;
      showTerminal();
      activeHostId = hostId;
      HOSTS.forEach(h => hosts[h.id].tab.classList.toggle("active", h.id === hostId));
      while (countSessions(hostId) < MIN_SESSIONS) createSession(hostId, false);
      const list = hosts[hostId].sessions;
      let target = list.find(s => s.key === activeSessionKey && s.hostId === hostId);
      if (!target) target = list[list.length - 1] || list[0];
      renderSessionTabs();
      updateHostCount(hostId);
      if (target) activateSession(target.key);
      try { localStorage.setItem("remote-term-host", hostId); } catch (e) {}
    }

    function activateSession(key) {
      let found = null;
      HOSTS.forEach(h => {
        hosts[h.id].sessions.forEach(s => { if (s.key === key) found = s; });
      });
      if (!found) return;
      showTerminal();
      activeHostId = found.hostId;
      activeSessionKey = key;
      emptyHint.classList.remove("show");
      HOSTS.forEach(h => {
        hosts[h.id].tab.classList.toggle("active", h.id === found.hostId);
        hosts[h.id].tab.setAttribute("aria-selected", String(h.id === found.hostId));
        hosts[h.id].sessions.forEach(s => s.pane.classList.toggle("active", s.key === key));
      });
      ensureIframe(found);
      renderSessionTabs();
      updateHostCount(found.hostId);
      highlightStatusHost(found.hostId);
      try {
        localStorage.setItem("remote-term-host", found.hostId);
        localStorage.setItem("remote-term-session-" + found.hostId, found.sid);
      } catch (e) {}
    }

    function closeSession(key) {
      let hostId = null;
      let idx = -1;
      HOSTS.forEach(h => {
        const i = hosts[h.id].sessions.findIndex(s => s.key === key);
        if (i >= 0) { hostId = h.id; idx = i; }
      });
      if (hostId == null || idx < 0) return;
      const state = hosts[hostId];
      const session = state.sessions[idx];

      // 先卸载终端页面，再移除本地会话记录。
      killIframe(session);
      if (session.pane) session.pane.remove();
      state.sessions.splice(idx, 1);

      if (activeSessionKey === key) {
        activeSessionKey = null;
        const next = state.sessions[state.sessions.length - 1];
        if (next) activateSession(next.key);
        else {
          emptyHint.classList.add("show");
          renderSessionTabs();
          updateHostCount(hostId);
        }
      } else {
        renderSessionTabs();
        updateHostCount(hostId);
      }
    }

    function reconnectCurrent() {
      if (!activeSessionKey) return;
      let session = null;
      HOSTS.forEach(h => {
        hosts[h.id].sessions.forEach(s => { if (s.key === activeSessionKey) session = s; });
      });
      if (!session) return;
      // 重连保留当前会话标签，卸载旧页面后允许创建新 iframe。
      killIframe(session);
      session.closed = false;
      ensureIframe(session);
      updateHostCount(session.hostId);
      renderSessionTabs();
    }

    function destroyAllSessions() {
      if (tearingDownAll) return;
      tearingDownAll = true;
      HOSTS.forEach(h => {
        const list = hosts[h.id].sessions.slice();
        list.forEach(s => {
          killIframe(s);
          if (s.pane) s.pane.remove();
        });
        hosts[h.id].sessions = [];
        updateHostCount(h.id);
      });
      activeSessionKey = null;
    }

    HOSTS.forEach(createHostTab);
    HOSTS.forEach(createStatusCard);
    overviewBtn.addEventListener("click", showOverview);
    refreshStatusBtn.addEventListener("click", refreshStatus);
    newSessionBtn.addEventListener("click", () => {
      if (!activeHostId) return;
      createSession(activeHostId, true);
    });
    reconnectBtn.addEventListener("click", reconnectCurrent);

    // 关标签页 / 刷新时，尽量释放浏览器端会话。
    window.addEventListener("pagehide", destroyAllSessions);
    window.addEventListener("beforeunload", destroyAllSessions);

    document.addEventListener("visibilitychange", () => {
      clearTimeout(pollTimer);
      clearTimeout(freshnessTimer);
      if (document.hidden) {
        requestGeneration++;
        if (activeRequest) activeRequest.abort();
      } else {
        resumeRefresh = true;
        renderStatus();
        refreshStatus();
      }
    });
    window.addEventListener("pagehide", () => {
      clearTimeout(pollTimer);
      clearTimeout(freshnessTimer);
      requestGeneration++;
      if (activeRequest) activeRequest.abort();
    });
    window.addEventListener("pageshow", event => {
      if (event.persisted) {
        tearingDownAll = false;
        showOverview();
        refreshStatus();
      }
    });
    // 首页只读取轻量状态缓存；用户选择机器后才建立终端连接。
    showOverview();
    refreshStatus();
  </script>
</body>
</html>
