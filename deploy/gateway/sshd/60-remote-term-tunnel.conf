# remote-term: the "tunnel" account exists only so the two Macs can hold their reverse
# SSH tunnels. It gets no shell, no TTY and no local forwarding (so it cannot reach the
# gateway's own loopback services); each key may listen only on its own port, set per key
# with permitlisten= in /etc/remote-term/tunnel_authorized_keys (managed by remote-term-admin).
Match User tunnel
    AuthorizedKeysFile /etc/remote-term/tunnel_authorized_keys
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    GatewayPorts no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
# Close the Match block so nothing after this file is scoped to the tunnel user by accident.
Match all
