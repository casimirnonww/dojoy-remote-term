name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what macOS ships as /usr/bin/python3; the gateway runs Ubuntu 24.04's 3.12.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Status tests (probe, agent, receiver)
        run: python -m unittest discover -s status -v
      - name: Deploy tests (render_config, remote-term-admin)
        run: python -m unittest discover -s deploy -v
      - name: web/hosts.js matches hosts.json
        run: python deploy/render_config.py --check-web web/hosts.js

  config:
    name: Lint and config checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx and ttyd
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx libnginx-mod-stream ttyd
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/hosts.js
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/*/*.sh deploy/gateway/remote-ttyd-ssh
      - name: nginx -t on the rendered gateway config
        run: |
          out=$(mktemp -d)
          python3 deploy/render_config.py --domain djai.djscz.com --out "$out" --allow-placeholders
          live=/etc/letsencrypt/live/djai.djscz.com
          sudo mkdir -p "$live"
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=djai.djscz.com -keyout "$live/privkey.pem" -out "$live/fullchain.pem"
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp "$out/nginx/remote-term.conf" /etc/nginx/sites-enabled/remote-term.conf
          sudo nginx -t
      - name: Behind an existing 443 SNI router (starts nginx; -t cannot see clashing listeners)
        run: |
          sudo systemctl stop nginx
          sudo bash deploy/tests/router_smoke.sh
      - name: systemd units
        run: |
          units=$(mktemp -d)
          cp deploy/gateway/systemd/* deploy/agent/remote-term-agent.* "$units/"
          mv "$units/remote-ttyd@.service" "$units/remote-ttyd@vps.service"
          # Installed by install_gateway.sh; stand in for them here.
          sudo install -m 755 /bin/true /usr/local/bin/oauth2-proxy
          sudo install -m 755 /bin/true /usr/local/sbin/remote-term-admin
          cd "$units" && systemd-analyze verify --man=no ./*.service ./*.path ./*.timer

  windows:
    # Windows PowerShell 5.1, as on Windows 11: parse every script, report and enroll against a
    # local receiver, and log in with the terminal key the join script installs.
    name: Windows (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows agent, enrollment and join script
        run: python deploy/tests/windows_e2e.py

  macos:
    # The Mac join script as people run it: bash 3.2 and /usr/bin/python3, as a normal user,
    # three times in a row, with this machine standing in for the gateway (TLS receiver, sshd
    # with a tunnel account), then a login through the tunnel.
    name: macOS (join script end to end)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mac join script, report, enrollment and tunnel
        run: python deploy/tests/mac_e2e.py
